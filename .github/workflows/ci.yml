name: Planora AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run automated test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          # Dummy/fallback values for build validation so Vite client env parsing succeeds in CI
          VITE_FIREBASE_API_KEY: "ci-mock-api-key"
          VITE_FIREBASE_AUTH_DOMAIN: "ci-mock-project.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "ci-mock-project"
          VITE_FIREBASE_STORAGE_BUCKET: "ci-mock-project.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:000000000000"
